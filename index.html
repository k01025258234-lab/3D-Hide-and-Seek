<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 총기 가챠 숨바꼭질</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .gacha-glow {
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.6);
        }
    </style>
</head>
<body class="relative select-none">

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-950/90 backdrop-blur-md p-4 overflow-y-auto">
        <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col gap-6 my-auto">
            
            <!-- Header -->
            <div class="flex flex-col md:flex-row justify-between items-center border-b border-slate-800 pb-4 gap-4">
                <div>
                    <h1 class="text-3xl font-black bg-gradient-to-r from-amber-400 via-rose-500 to-indigo-500 bg-clip-text text-transparent">
                        3D 총기 가챠 숨바꼭질
                    </h1>
                    <p class="text-xs text-slate-400 mt-1">모바일 & PC 완벽 지원! 벽 통과 누브와 1인 술래 감염모드!</p>
                </div>
                <div class="flex items-center gap-4 bg-slate-800/80 px-4 py-2 rounded-2xl border border-slate-700">
                    <i class="fa-solid fa-coins text-amber-400 text-xl"></i>
                    <span id="lobby-coins" class="font-extrabold text-amber-300 text-lg">1,000</span>
                    <span class="text-xs text-slate-400">골드</span>
                </div>
            </div>

            <!-- Settings Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Left Options -->
                <div class="flex flex-col gap-4">
                    <!-- Map Selection -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-slate-300"><i class="fa-solid fa-map text-indigo-400 mr-2"></i>맵 선택</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="selectMap('backrooms')" id="map-btn-backrooms" class="map-btn py-2 px-3 rounded-xl border border-indigo-500 bg-indigo-600/30 text-xs font-bold transition hover:bg-indigo-600/50">백룸</button>
                            <button onclick="selectMap('factory')" id="map-btn-factory" class="map-btn py-2 px-3 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold transition hover:bg-slate-700">용암 동굴 (3칸)</button>
                            <button onclick="selectMap('city')" id="map-btn-city" class="map-btn py-2 px-3 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold transition hover:bg-slate-700">사이버 도시</button>
                        </div>
                    </div>

                    <!-- Map Size -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-slate-300"><i class="fa-solid fa-expand text-emerald-400 mr-2"></i>맵 크기 (거대 사이즈 포함)</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="selectSize('small')" id="size-btn-small" class="size-btn py-2 px-2 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">보통</button>
                            <button onclick="selectSize('large')" id="size-btn-large" class="size-btn py-2 px-2 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">매우 큼</button>
                            <button onclick="selectSize('huge')" id="size-btn-huge" class="size-btn py-2 px-2 rounded-xl border border-emerald-500 bg-emerald-600/30 text-xs font-bold">초거대 미로</button>
                            <button onclick="selectSize('massive')" id="size-btn-massive" class="size-btn py-2 px-2 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">엄청난 거대</button>
                        </div>
                    </div>

                    <!-- Infection Mode Toggle -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-slate-300"><i class="fa-solid fa-virus text-rose-400 mr-2"></i>게임 모드 (술래는 항상 1명 시작)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="selectInfectionMode(true)" id="inf-btn-yes" class="inf-btn py-2 px-3 rounded-xl border border-rose-500 bg-rose-600/30 text-xs font-bold">감염모드 (잡히면 술래)</button>
                            <button onclick="selectInfectionMode(false)" id="inf-btn-no" class="inf-btn py-2 px-3 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">감염모드 X (잡히면 탈락)</button>
                        </div>
                    </div>

                    <!-- Bot Difficulty -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-slate-300"><i class="fa-solid fa-robot text-amber-400 mr-2"></i>누브 AI 강약 조절</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="selectDifficulty('easy')" id="diff-btn-easy" class="diff-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">초보</button>
                            <button onclick="selectDifficulty('normal')" id="diff-btn-normal" class="diff-btn py-2 px-1 rounded-xl border border-amber-500 bg-amber-600/30 text-xs font-bold">보통</button>
                            <button onclick="selectDifficulty('hard')" id="diff-btn-hard" class="diff-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">어려움</button>
                            <button onclick="selectDifficulty('extreme')" id="diff-btn-extreme" class="diff-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold">지옥</button>
                        </div>
                    </div>

                    <!-- Player Custom Speed Slider -->
                    <div class="flex flex-col gap-1 bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                        <div class="flex justify-between items-center text-xs font-bold text-slate-300">
                            <span><i class="fa-solid fa-person-running text-cyan-400 mr-2"></i>내 이동 속도 조절</span>
                            <span id="speed-slider-val" class="text-cyan-400 font-extrabold">1.2x</span>
                        </div>
                        <input type="range" id="custom-speed-slider" min="0.8" max="2.5" step="0.1" value="1.2" class="w-full accent-cyan-500 cursor-pointer">
                    </div>
                </div>

                <!-- Right Options: Gacha & Upgrades -->
                <div class="flex flex-col gap-4 bg-slate-950/40 p-4 rounded-2xl border border-slate-800">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-amber-400"><i class="fa-solid fa-gun mr-2"></i>총기 가챠 & 인벤토리</h3>
                        <button onclick="openGachaModal()" class="bg-gradient-to-r from-amber-500 to-rose-500 text-white px-4 py-1.5 rounded-xl font-extrabold text-xs shadow-lg hover:opacity-90 active:scale-95 transition">
                            <i class="fa-solid fa-cube mr-1"></i> 300골드 뽑기
                        </button>
                    </div>

                    <!-- Current Gun Showcase -->
                    <div id="current-gun-display" class="bg-slate-900 border border-amber-500/50 p-3 rounded-xl flex items-center gap-4">
                        <div class="w-14 h-14 bg-slate-800 rounded-lg flex items-center justify-center text-2xl text-amber-400 border border-slate-700">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <div>
                            <div id="equipped-gun-name" class="font-extrabold text-amber-300 text-sm">기본 레이저 피스톨</div>
                            <div class="text-[10px] text-slate-400">공격력: 25 | 연사속도: 보통</div>
                        </div>
                    </div>

                    <!-- Upgrades -->
                    <div class="flex flex-col gap-2 mt-2">
                        <span class="text-xs font-bold text-slate-300"><i class="fa-solid fa-bolt text-indigo-400 mr-2"></i>능력 강화 (총 27명 누브 대책)</span>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="upgradeStat('damage')" class="bg-slate-800 border border-slate-700 p-2 rounded-xl text-center hover:bg-slate-700 transition">
                                <div class="text-[10px] text-slate-400">공격력 강화</div>
                                <div id="dmg-lvl" class="text-xs font-bold text-amber-400 mt-1">Lv.1 (200G)</div>
                            </button>
                            <button onclick="upgradeStat('fireRate')" class="bg-slate-800 border border-slate-700 p-2 rounded-xl text-center hover:bg-slate-700 transition">
                                <div class="text-[10px] text-slate-400">연사력 강화</div>
                                <div id="fr-lvl" class="text-xs font-bold text-amber-400 mt-1">Lv.1 (200G)</div>
                            </button>
                            <button onclick="upgradeStat('moveSpeed')" class="bg-slate-800 border border-slate-700 p-2 rounded-xl text-center hover:bg-slate-700 transition">
                                <div class="text-[10px] text-slate-400">이동속도 강화</div>
                                <div id="spd-lvl" class="text-xs font-bold text-amber-400 mt-1">Lv.1 (200G)</div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Start Game Button -->
            <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 via-rose-600 to-amber-600 text-white font-black text-lg shadow-2xl hover:opacity-95 active:scale-[0.99] transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> 27명의 숨는 누브와 함께 게임 시작하기!
            </button>
        </div>
    </div>

    <!-- IN-GAME HUD -->
    <div id="game-hud" class="absolute inset-0 pointer-events-none hidden z-30 flex flex-col justify-between p-4">
        <!-- Top Bar -->
        <div class="flex justify-between items-center">
            <div class="bg-slate-900/80 border border-slate-700 px-4 py-2 rounded-2xl backdrop-blur flex items-center gap-4">
                <div>
                    <div class="text-[10px] text-slate-400">남은 시간</div>
                    <div id="hud-timer" class="font-black text-xl text-amber-400">05:00</div>
                </div>
                <div class="h-6 w-px bg-slate-700"></div>
                <div>
                    <div class="text-[10px] text-slate-400">내 역할</div>
                    <div id="hud-role" class="font-extrabold text-sm text-emerald-400">도망자 (Runner)</div>
                </div>
            </div>

            <div class="bg-slate-900/80 border border-slate-700 px-4 py-2 rounded-2xl backdrop-blur flex items-center gap-4">
                <div>
                    <div class="text-[10px] text-slate-400">생존 / 술래</div>
                    <div id="hud-stats" class="font-black text-sm text-rose-400">도망자 27명 / 술래 1명</div>
                </div>
                <button onclick="returnToLobby()" class="pointer-events-auto bg-rose-600/80 hover:bg-rose-600 text-white px-3 py-1.5 rounded-xl font-bold text-xs transition">
                    나가기
                </button>
            </div>
        </div>

        <!-- Crosshair -->
        <div class="crosshair flex items-center justify-center">
            <div class="w-2 h-2 bg-emerald-400 rounded-full border border-black/50"></div>
        </div>

        <!-- MOBILE TOUCH CONTROLS OVERLAY -->
        <div id="mobile-controls" class="absolute inset-0 pointer-events-none flex justify-between items-end p-6 z-30 select-none">
            <!-- Left: Virtual Joystick Area -->
            <div id="touch-joystick-area" class="pointer-events-auto w-36 h-36 rounded-full bg-slate-800/40 border border-slate-600/50 backdrop-blur relative flex items-center justify-center touch-none">
                <div id="touch-joystick-thumb" class="w-14 h-14 rounded-full bg-indigo-500/80 border border-indigo-300 shadow-lg absolute"></div>
                <div class="absolute bottom-1 text-[10px] text-slate-300 font-bold pointer-events-none">이동 조이스틱</div>
            </div>

            <!-- Right: Action Buttons (Shoot, Camouflage, Jump/Dash) -->
            <div class="pointer-events-auto flex flex-col gap-3">
                <button id="btn-touch-camouflage" class="w-16 h-16 rounded-2xl bg-emerald-600/80 border border-emerald-400 text-white font-bold text-xs flex flex-col items-center justify-center shadow-xl active:scale-95 touch-none">
                    <i class="fa-solid fa-shirt text-lg"></i>
                    <span>위장(E)</span>
                </button>
                <button id="btn-touch-shoot" class="w-20 h-20 rounded-full bg-gradient-to-tr from-rose-600 to-amber-600 border-2 border-amber-300 text-white font-extrabold text-sm flex flex-col items-center justify-center shadow-2xl active:scale-95 touch-none">
                    <i class="fa-solid fa-crosshairs text-2xl"></i>
                    <span>발사</span>
                </button>
            </div>
        </div>

        <!-- Bottom Weapon & Stats Bar -->
        <div class="flex justify-between items-end pointer-events-auto">
            <div class="bg-slate-900/80 border border-slate-700 px-4 py-2 rounded-2xl backdrop-blur flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-500/20 border border-amber-500/50 rounded-xl flex items-center justify-center text-amber-400 text-lg">
                    <i class="fa-solid fa-gun"></i>
                </div>
                <div>
                    <div id="hud-gun-name" class="font-extrabold text-amber-300 text-xs">기본 피스톨</div>
                    <div class="text-[10px] text-slate-400">발사: 좌클릭 또는 우측 발사 버튼</div>
                </div>
            </div>

            <div class="bg-slate-900/80 border border-slate-700 px-4 py-2 rounded-2xl backdrop-blur text-right">
                <div class="text-[10px] text-slate-400">조작 가이드</div>
                <div class="text-xs font-bold text-indigo-400">WASD 이동 / 마우스/터치 시점 / E 위장</div>
            </div>
        </div>
    </div>

    <!-- GACHA MODAL -->
    <div id="gacha-modal" class="absolute inset-0 z-40 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-amber-500/50 rounded-3xl p-6 max-w-md w-full text-center flex flex-col gap-4 shadow-2xl gacha-glow">
            <h2 class="text-xl font-black text-amber-400"><i class="fa-solid fa-gift mr-2"></i>총기 가챠 소환</h2>
            <div id="gacha-result-box" class="py-8 bg-slate-950 rounded-2xl border border-slate-800 flex flex-col items-center justify-center gap-2">
                <i class="fa-solid fa-box-open text-5xl text-amber-500 animate-bounce"></i>
                <span class="text-xs text-slate-400">상자를 열어 강력한 총기를 획득하세요!</span>
            </div>
            <div class="flex gap-2">
                <button onclick="rollGacha()" class="flex-1 py-3 bg-gradient-to-r from-amber-500 to-rose-500 rounded-xl font-black text-white text-sm shadow-lg hover:opacity-90 transition">
                    300 골드 뽑기
                </button>
                <button onclick="closeGachaModal()" class="px-5 py-3 bg-slate-800 rounded-xl font-bold text-slate-300 text-sm hover:bg-slate-700 transition">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <script>
        // Game Configuration & State
        let scene, camera, renderer, clock;
        let mapObjects = [];
        let entities = [];
        let bullets = [];
        let lavaAbysses = [];
        let p1 = null;
        let lastShootTime = 0;
        const keyState = {};
        const mouseLook = { x: 0, y: 0 };

        // Mobile touch control state
        const touchState = {
            joystickActive: false,
            joystickTouchId: null,
            joystickCenter: { x: 0, y: 0 },
            joystickVector: { x: 0, z: 0 },
            lookTouchId: null,
            lastLookPos: { x: 0, y: 0 }
        };

        const gameState = {
            coins: 1000,
            infectionMode: true, // true: 감염모드 (잡히면 술래), false: 감염모드X (잡히면 탈락)
            selectedMap: 'backrooms',
            mapSize: 'small',
            mapLimit: 20,
            botDifficulty: 'normal',
            equippedGunIndex: 0,
            upgrades: {
                damageLvl: 1,
                fireRateLvl: 1,
                moveSpeedLvl: 1
            },
            inGame: false,
            timeRemaining: 300,
            myRole: 'runner'
        };

        const guns = [
            { name: "기본 레이저 피스톨", damage: 25, fireRate: 400, color: 0x38bdf8 },
            { name: "네온 SMG", damage: 35, fireRate: 200, color: 0xa855f7 },
            { name: "플라즈마 샷건", damage: 70, fireRate: 800, color: 0xf43f5e },
            { name: "골드 건틀렛 라이플", damage: 120, fireRate: 150, color: 0xfbbf24 }
        ];

        // Sound Synthesizer using Web Audio API
        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },
            playTag() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        function selectMap(mapName) {
            gameState.selectedMap = mapName;
            document.querySelectorAll('.map-btn').forEach(btn => {
                btn.classList.remove('border-indigo-500', 'bg-indigo-600/30');
                btn.classList.add('border-slate-700', 'bg-slate-800');
            });
            const selectedBtn = document.getElementById(`map-btn-${mapName}`);
            if (selectedBtn) {
                selectedBtn.classList.remove('border-slate-700', 'bg-slate-800');
                selectedBtn.classList.add('border-indigo-500', 'bg-indigo-600/30');
            }
        }

        function selectSize(size) {
            gameState.mapSize = size;
            if (size === 'small') gameState.mapLimit = 20;
            else if (size === 'large') gameState.mapLimit = 40;
            else if (size === 'huge') gameState.mapLimit = 70;
            else if (size === 'massive') gameState.mapLimit = 110;

            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.remove('border-emerald-500', 'bg-emerald-600/30');
                btn.classList.add('border-slate-700', 'bg-slate-800');
            });
            const selectedBtn = document.getElementById(`size-btn-${size}`);
            if (selectedBtn) {
                selectedBtn.classList.remove('border-slate-700', 'bg-slate-800');
                selectedBtn.classList.add('border-emerald-500', 'bg-emerald-600/30');
            }
        }

        function selectInfectionMode(isInf) {
            gameState.infectionMode = isInf;
            document.getElementById('inf-btn-yes').className = isInf 
                ? "inf-btn py-2 px-3 rounded-xl border border-rose-500 bg-rose-600/30 text-xs font-bold"
                : "inf-btn py-2 px-3 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold";
            document.getElementById('inf-btn-no').className = !isInf 
                ? "inf-btn py-2 px-3 rounded-xl border border-rose-500 bg-rose-600/30 text-xs font-bold"
                : "inf-btn py-2 px-3 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold";
        }

        function selectDifficulty(diff) {
            gameState.botDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-600/30');
                btn.classList.add('border-slate-700', 'bg-slate-800');
            });
            const selectedBtn = document.getElementById(`diff-btn-${diff}`);
            if (selectedBtn) {
                selectedBtn.classList.remove('border-slate-700', 'bg-slate-800');
                selectedBtn.classList.add('border-amber-500', 'bg-amber-600/30');
            }
        }

        function openGachaModal() {
            document.getElementById('gacha-modal').classList.remove('hidden');
        }

        function closeGachaModal() {
            document.getElementById('gacha-modal').classList.add('hidden');
        }

        function rollGacha() {
            if (gameState.coins < 300) {
                alert("골드가 부족합니다!");
                return;
            }
            gameState.coins -= 300;
            document.getElementById('lobby-coins').innerText = gameState.coins.toLocaleString();

            const randomGunIdx = Math.floor(Math.random() * guns.length);
            gameState.equippedGunIndex = randomGunIdx;
            const gun = guns[randomGunIdx];

            document.getElementById('gacha-result-box').innerHTML = `
                <div class="text-3xl text-amber-400 font-black mb-1"><i class="fa-solid fa-gun"></i></div>
                <div class="text-sm font-extrabold text-amber-300">${gun.name} 획득!</div>
                <div class="text-[10px] text-slate-400 mt-1">공격력: ${gun.damage} | 연사속도: ${gun.fireRate}ms</div>
            `;
            updateEquippedGunDisplay();
        }

        function updateEquippedGunDisplay() {
            const gun = guns[gameState.equippedGunIndex];
            document.getElementById('equipped-gun-name').innerText = gun.name;
            document.getElementById('hud-gun-name').innerText = gun.name;
        }

        function upgradeStat(statType) {
            const cost = 200;
            if (gameState.coins < cost) {
                alert("골드가 부족합니다!");
                return;
            }
            gameState.coins -= cost;
            document.getElementById('lobby-coins').innerText = gameState.coins.toLocaleString();

            if (statType === 'damage') {
                gameState.upgrades.damageLvl++;
                document.getElementById('dmg-lvl').innerText = `Lv.${gameState.upgrades.damageLvl} (200G)`;
            } else if (statType === 'fireRate') {
                gameState.upgrades.fireRateLvl++;
                document.getElementById('fr-lvl').innerText = `Lv.${gameState.upgrades.fireRateLvl} (200G)`;
            } else if (statType === 'moveSpeed') {
                gameState.upgrades.moveSpeedLvl++;
                document.getElementById('spd-lvl').innerText = `Lv.${gameState.upgrades.moveSpeedLvl} (200G)`;
            }
        }

        function returnToLobby() {
            gameState.inGame = false;
            document.getElementById('game-hud').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            if (document.exitPointerLock) document.exitPointerLock();
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            clock = new THREE.Clock();
            setupControls();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function generateMap(mapType) {
            // Remove old map objects
            mapObjects.forEach(obj => scene.remove(obj));
            mapObjects = [];
            lavaAbysses = [];

            const limit = gameState.mapLimit;

            // Floor
            const floorGeo = new THREE.PlaneGeometry(limit * 2.5, limit * 2.5);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: mapType === 'backrooms' ? 0xd4af37 : mapType === 'factory' ? 0x27272a : 0x1e293b, 
                roughness: 0.8 
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            mapObjects.push(floor);

            // Ceiling
            const ceilGeo = new THREE.PlaneGeometry(limit * 2.5, limit * 2.5);
            const ceilMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
            const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 10;
            scene.add(ceiling);
            mapObjects.push(ceiling);

            // Exactly 3 Lava Pits for Cave / Factory Map
            if (mapType === 'factory') {
                const lavaGeo = new THREE.BoxGeometry(6, 0.2, 6);
                const lavaMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
                const lavaPositions = [
                    new THREE.Vector3(-15, 0.1, -15),
                    new THREE.Vector3(15, 0.1, 15),
                    new THREE.Vector3(0, 0.1, 25)
                ];
                lavaPositions.forEach(pos => {
                    const lavaMesh = new THREE.Mesh(lavaGeo, lavaMat);
                    lavaMesh.position.copy(pos);
                    scene.add(lavaMesh);
                    lavaAbysses.push(lavaMesh);
                    mapObjects.push(lavaMesh);
                });
            }

            // Procedural Obstacles / Maze Walls
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: mapType === 'backrooms' ? 0xfef08a : mapType === 'factory' ? 0x3f3f46 : 0x334155,
                roughness: 0.5 
            });

            const wallCount = Math.floor(limit * 1.2);
            for (let i = 0; i < wallCount; i++) {
                const w = Math.random() * 4 + 3;
                const h = 10;
                const d = Math.random() * 4 + 3;
                const wallGeo = new THREE.BoxGeometry(w, h, d);
                const wall = new THREE.Mesh(wallGeo, wallMat);

                const x = (Math.random() - 0.5) * (limit * 1.8);
                const z = (Math.random() - 0.5) * (limit * 1.8);
                if (Math.abs(x) < 6 && Math.abs(z) < 6) continue; // Keep spawn clear

                wall.position.set(x, h / 2, z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                mapObjects.push(wall);
            }
        }

        function setupEntities() {
            entities = [];

            // Player Setup
            const pGroup = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.8, 1.4, 0.6);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 0.7;
            pGroup.add(bodyMesh);

            pGroup.position.set(0, 0, 0);
            scene.add(pGroup);

            p1 = {
                mesh: pGroup,
                role: 'runner', // always starts as runner
                speed: 8.0,
                health: 100,
                isCamouflaged: false
            };

            // Exactly 27 Bots (1 Seeker, 26 Runners)
            const totalBots = 27;
            for (let i = 0; i < totalBots; i++) {
                const botGroup = new THREE.Group();
                const isSeeker = (i === 0); // Exactly 1 Seeker at start

                const bMat = new THREE.MeshStandardMaterial({ 
                    color: isSeeker ? 0xf43f5e : 0x22c55e, // Red for Seeker, Green for Noob Runner
                    roughness: 0.3 
                });
                const bMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.6), bMat);
                bMesh.position.y = 0.7;
                botGroup.add(bMesh);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (gameState.mapLimit * 0.7) + 5;
                botGroup.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

                scene.add(botGroup);

                entities.push({
                    mesh: botGroup,
                    isSeeker: isSeeker,
                    speed: isSeeker ? 7.2 : 6.5,
                    passThroughWalls: true, // Hiding noobs pass through walls!
                    wanderTimer: Math.random() * 3
                });
            }
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                keyState[e.code] = true;
                if (e.code === 'KeyE') {
                    triggerCamouflage();
                }
            });

            window.addEventListener('keyup', (e) => {
                keyState[e.code] = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (!gameState.inGame) return;
                if (document.pointerLockElement === document.getElementById('canvas-container') || document.pointerLockElement === document.body || window.innerWidth <= 1024) {
                    const sensitivity = 0.002;
                    mouseLook.x -= e.movementX * sensitivity;
                    mouseLook.y -= e.movementY * sensitivity;

                    const maxPitch = Math.PI / 2.2;
                    mouseLook.y = Math.max(-maxPitch, Math.min(maxPitch, mouseLook.y));
                }
            });

            window.addEventListener('mousedown', (e) => {
                if (gameState.inGame && e.button === 0) {
                    shootWeapon();
                }
            });

            // MOBILE TOUCH CONTROLS SETUP
            const joystickArea = document.getElementById('touch-joystick-area');
            const joystickThumb = document.getElementById('touch-joystick-thumb');

            joystickArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.targetTouches[0];
                touchState.joystickTouchId = touch.identifier;
                const rect = joystickArea.getBoundingClientRect();
                touchState.joystickCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                touchState.joystickActive = true;
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!gameState.inGame) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    
                    // Handle Joystick movement
                    if (touchState.joystickActive && touch.identifier === touchState.joystickTouchId) {
                        const dx = touch.clientX - touchState.joystickCenter.x;
                        const dy = touch.clientY - touchState.joystickCenter.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = 45;

                        const clampedDist = Math.min(dist, maxDist);
                        const angle = Math.atan2(dy, dx);

                        const thumbX = Math.cos(angle) * clampedDist;
                        const thumbY = Math.sin(angle) * clampedDist;
                        joystickThumb.style.transform = `translate(${thumbX}px, ${thumbY}px)`;

                        touchState.joystickVector.x = (thumbX / maxDist);
                        touchState.joystickVector.z = (thumbY / maxDist);
                    }

                    // Handle Look around on right side of screen
                    if (touch.clientX > window.innerWidth / 2 && touch.identifier !== touchState.joystickTouchId) {
                        if (touchState.lookTouchId === null) {
                            touchState.lookTouchId = touch.identifier;
                            touchState.lastLookPos = { x: touch.clientX, y: touch.clientY };
                        } else if (touch.identifier === touchState.lookTouchId) {
                            const deltaX = touch.clientX - touchState.lastLookPos.x;
                            const deltaY = touch.clientY - touchState.lastLookPos.y;
                            touchState.lastLookPos = { x: touch.clientX, y: touch.clientY };

                            const sensitivity = 0.005;
                            mouseLook.x -= deltaX * sensitivity;
                            mouseLook.y -= deltaY * sensitivity;

                            const maxPitch = Math.PI / 2.2;
                            mouseLook.y = Math.max(-maxPitch, Math.min(maxPitch, mouseLook.y));
                        }
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touchState.joystickActive && touch.identifier === touchState.joystickTouchId) {
                        touchState.joystickActive = false;
                        touchState.joystickTouchId = null;
                        touchState.joystickVector.x = 0;
                        touchState.joystickVector.z = 0;
                        joystickThumb.style.transform = `translate(0px, 0px)`;
                    }
                    if (touch.identifier === touchState.lookTouchId) {
                        touchState.lookTouchId = null;
                    }
                }
            });

            // Mobile Action Buttons
            document.getElementById('btn-touch-shoot').addEventListener('touchstart', (e) => {
                e.preventDefault();
                shootWeapon();
            }, { passive: false });

            document.getElementById('btn-touch-camouflage').addEventListener('touchstart', (e) => {
                e.preventDefault();
                triggerCamouflage();
            }, { passive: false });
        }

        function startGame() {
            SoundFX.init();
            gameState.inGame = true;
            gameState.timeRemaining = 300;

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-hud').classList.remove('hidden');

            generateMap(gameState.selectedMap);
            setupEntities();

            const canvasContainer = document.getElementById('canvas-container');
            if (canvasContainer && canvasContainer.requestPointerLock) {
                canvasContainer.requestPointerLock().catch(() => {});
            }
        }

        function triggerCamouflage() {
            if (!p1) return;
            p1.isCamouflaged = !p1.isCamouflaged;
            p1.mesh.children[0].material.opacity = p1.isCamouflaged ? 0.2 : 1.0;
            p1.mesh.children[0].material.transparent = true;
        }

        function shootWeapon() {
            const now = performance.now();
            const gun = guns[gameState.equippedGunIndex];
            const fireRateBonus = Math.max(100, gun.fireRate - (gameState.upgrades.fireRateLvl - 1) * 50);

            if (now - lastShootTime < fireRateBonus) return;
            lastShootTime = now;
            SoundFX.playShoot();

            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: gun.color });
            const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);

            const dir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(mouseLook.y, mouseLook.x, 0, 'YXZ'));
            bulletMesh.position.copy(p1.mesh.position).add(new THREE.Vector3(0, 1.2, 0));

            scene.add(bulletMesh);
            bullets.push({
                mesh: bulletMesh,
                dir: dir,
                speed: 40,
                life: 2.0,
                damage: gun.damage * (1 + (gameState.upgrades.damageLvl - 1) * 0.2)
            });
        }

        let timerAccumulator = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (gameState.inGame) {
                timerAccumulator += delta;
                if (timerAccumulator >= 1.0) {
                    timerAccumulator = 0;
                    gameState.timeRemaining = Math.max(0, gameState.timeRemaining - 1);
                    const mins = String(Math.floor(gameState.timeRemaining / 60)).padStart(2, '0');
                    const secs = String(gameState.timeRemaining % 60).padStart(2, '0');
                    document.getElementById('hud-timer').innerText = `${mins}:${secs}`;
                }

                updatePlayer(delta);
                updateEntities(delta);
                updateBullets(delta);
            }

            renderer.render(scene, camera);
        }

        function updatePlayer(delta) {
            if (!p1) return;

            const upgradeBonus = 1 + (gameState.upgrades.moveSpeedLvl - 1) * 0.15;
            const customSliderVal = parseFloat(document.getElementById('custom-speed-slider')?.value || '1.2');
            const currentSpeed = p1.speed * upgradeBonus * customSliderVal;

            const moveDir = new THREE.Vector3();
            if (keyState['KeyW'] || keyState['ArrowUp']) moveDir.z -= 1;
            if (keyState['KeyS'] || keyState['ArrowDown']) moveDir.z += 1;
            if (keyState['KeyA'] || keyState['ArrowLeft']) moveDir.x -= 1;
            if (keyState['KeyD'] || keyState['ArrowRight']) moveDir.x += 1;

            if (touchState.joystickVector.x !== 0 || touchState.joystickVector.z !== 0) {
                moveDir.x += touchState.joystickVector.x;
                moveDir.z += touchState.joystickVector.z;
            }

            moveDir.normalize();
            const euler = new THREE.Euler(0, mouseLook.x, 0, 'YXZ');
            moveDir.applyEuler(euler);

            const oldPos = p1.mesh.position.clone();
            p1.mesh.position.x += moveDir.x * currentSpeed * delta;
            
            // Check map boundaries
            const limit = gameState.mapLimit;
            p1.mesh.position.x = Math.max(-limit, Math.min(limit, p1.mesh.position.x));
            p1.mesh.position.z += moveDir.z * currentSpeed * delta;
            p1.mesh.position.z = Math.max(-limit, Math.min(limit, p1.mesh.position.z));

            // Check Lava pit collision for player
            lavaAbysses.forEach(lava => {
                if (Math.abs(p1.mesh.position.x - lava.position.x) < 3.2 && Math.abs(p1.mesh.position.z - lava.position.z) < 3.2) {
                    if (p1.role === 'runner') {
                        p1.role = 'seeker';
                        p1.mesh.children[0].material.color.setHex(0xf43f5e);
                        document.getElementById('hud-role').innerText = "술래 (Seeker - 용암 감염!)";
                        document.getElementById('hud-role').className = "font-extrabold text-sm text-rose-400";
                        SoundFX.playTag();
                    }
                }
            });

            camera.rotation.set(mouseLook.y, mouseLook.x, 0, 'YXZ');
            const cameraOffset = new THREE.Vector3(0, 1.8, 0);
            camera.position.copy(p1.mesh.position).add(cameraOffset);
        }

        function updateEntities(delta) {
            let seekerCount = 0;
            let runnerCount = 0;

            entities.forEach(bot => {
                if (bot.isSeeker) seekerCount++;
                else runnerCount++;

                // Classic blocky upright movement (no swinging, stiff classic Roblox style)
                let targetPos = p1.mesh.position;
                
                if (bot.isSeeker) {
                    // Seeker chases player or nearest runner
                    let closestDist = bot.mesh.position.distanceTo(p1.mesh.position);
                    targetPos = p1.mesh.position;

                    entities.forEach(other => {
                        if (!other.isSeeker) {
                            const d = bot.mesh.position.distanceTo(other.mesh.position);
                            if (d < closestDist) {
                                closestDist = d;
                                targetPos = other.mesh.position;
                            }
                        }
                    });

                    const dir = new THREE.Vector3().subVectors(targetPos, bot.mesh.position).normalize();
                    bot.mesh.position.addScaledVector(dir, bot.speed * delta);
                    bot.mesh.lookAt(targetPos.x, bot.mesh.position.y, targetPos.z);

                    // Tagging check
                    if (bot.mesh.position.distanceTo(p1.mesh.position) < 1.2 && p1.role === 'runner') {
                        if (gameState.infectionMode) {
                            p1.role = 'seeker';
                            p1.mesh.children[0].material.color.setHex(0xf43f5e);
                            document.getElementById('hud-role').innerText = "술래 (Seeker - 감염됨!)";
                            document.getElementById('hud-role').className = "font-extrabold text-sm text-rose-400";
                            SoundFX.playTag();
                        } else {
                            alert("게임 오버! 술래에게 잡혔습니다!");
                            returnToLobby();
                        }
                    }
                } else {
                    // Hiding Noobs: Match player speed, flee smartly, pass through walls!
                    const distToPlayer = bot.mesh.position.distanceTo(p1.mesh.position);
                    const fleeDir = new THREE.Vector3().subVectors(bot.mesh.position, p1.mesh.position).normalize();
                    
                    if (distToPlayer < 12) {
                        // Flee away with player matching speed
                        const diffSliderVal = parseFloat(document.getElementById('custom-speed-slider')?.value || '1.2');
                        bot.mesh.position.addScaledVector(fleeDir, p1.speed * diffSliderVal * 0.95 * delta);
                    } else {
                        // Wander calmly
                        bot.wanderTimer -= delta;
                        if (bot.wanderTimer <= 0) {
                            bot.wanderTimer = 3 + Math.random() * 2;
                            bot.randomAngle = Math.random() * Math.PI * 2;
                        }
                        const wanderDir = new THREE.Vector3(Math.cos(bot.randomAngle), 0, Math.sin(bot.randomAngle));
                        bot.mesh.position.addScaledVector(wanderDir, 3.0 * delta);
                    }

                    // Map limit clamp for runners passing through walls
                    const limit = gameState.mapLimit;
                    bot.mesh.position.x = Math.max(-limit, Math.min(limit, bot.mesh.position.x));
                    bot.mesh.position.z = Math.max(-limit, Math.min(limit, bot.mesh.position.z));

                    // Lava pit check for bots
                    lavaAbysses.forEach(lava => {
                        if (Math.abs(bot.mesh.position.x - lava.position.x) < 3.0 && Math.abs(bot.mesh.position.z - lava.position.z) < 3.0) {
                            if (!bot.isSeeker && gameState.infectionMode) {
                                bot.isSeeker = true;
                                bot.mesh.children[0].material.color.setHex(0xf43f5e);
                                SoundFX.playTag();
                            }
                        }
                    });
                }
            });

            if (p1.role === 'seeker') seekerCount++;
            else runnerCount++;

            document.getElementById('hud-stats').innerText = `도망자 ${runnerCount}명 / 술래 ${seekerCount}명`;
        }

        function updateBullets(delta) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.addScaledVector(b.dir, b.speed * delta);
                b.life -= delta;

                // Check bullet hit on bots
                let hit = false;
                for (let j = 0; j < entities.length; j++) {
                    const bot = entities[j];
                    if (b.mesh.position.distanceTo(bot.mesh.position) < 1.0) {
                        hit = true;
                        if (!bot.isSeeker && gameState.infectionMode) {
                            bot.isSeeker = true;
                            bot.mesh.children[0].material.color.setHex(0xf43f5e);
                            SoundFX.playTag();
                        }
                        break;
                    }
                }

                if (hit || b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }
        }

        window.onload = function() {
            initThree();
        };
    </script>
